# Local environment of BantuKasir (TASK-001; EXECUTION_CONTEXT section 18): the
# application container (Nginx and PHP-FPM) and PostgreSQL, the same on the
# Owner's Windows machine (Docker Desktop with WSL2) and on CI's Linux runner.
#
#   Start:  docker compose up -d --build --wait
#   Stop:   docker compose down
#
# The application answers on http://localhost:8080 (APP_PORT changes the port).
# "docker compose down" keeps the database volume; never add --volumes or -v.
# Commands of the command contract (TEST_STRATEGY section 7) run in containers:
#   docker compose exec app composer <script>
#   docker compose run --rm node npm <script>
#   docker compose run --rm playwright npm run test:e2e
# The environment holds synthetic data only and no secret: PostgreSQL accepts
# connections without a password, only on the project's internal network.
#
# The database (TASK-004): at every start the service db-setup runs
# database/setup/local.sh, which runs database/setup/setup.sql — the script of
# ENVIRONMENTS ENV-30 — for the local database bantukasir (marker local) and the
# test database bantukasir_test (marker test), with three local roles, and then
# its self-test. The application connects as the runtime role; migrations run
# only as the migration role (SCHEMA section 10):
#   docker compose exec app php artisan migrate --database=pgsql_migration
# The tests migrate and reset bantukasir_test only (TEST_STRATEGY TS-07).

name: bantukasir

services:
    app:
        # The development stage of the one image (TASK-012): the runtime of the
        # release, Nginx and PHP-FPM with the same configuration, plus Composer,
        # Git and Gitleaks, with the repository bind-mounted below and as root,
        # because the files belong to the host's user. The release's stage is
        # checked by scripts/checks/image-checks.sh, in CI.
        build:
            context: .
            dockerfile: docker/app/Dockerfile
            target: development
        image: bantukasir-app:local
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:8080"
        environment:
            APP_ENV: local
            APP_PROCESS_ROLE: web
            APP_DEBUG: "true"
            APP_URL: "http://localhost:${APP_PORT:-8080}"
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: "5432"
            DB_DATABASE: bantukasir
            # The local roles of database/setup/local.sh; no password (above).
            DB_USERNAME: bk_runtime
            DB_MIGRATION_USERNAME: bk_migration
            BACKUP_DB_USERNAME: bk_backup
            APP_ENVIRONMENT_NAME: local
            # Sign-in sessions in the database and the rate limiter's counters
            # in the database cache store (ADR-002; TASK-006): the local
            # database is migrated first, with the command above.
            SESSION_DRIVER: database
            CACHE_STORE: database
            # Local runs are plain HTTP; every other environment sets true.
            SESSION_SECURE_COOKIE: "false"
            # The host names of the local environment (SECURITY_MODEL SEC-HDR-05;
            # TASK-007): the Owner's browser and the browser tests' alias below.
            APP_TRUSTED_HOSTS: "localhost,bantukasir-app"
        volumes:
            - .:/var/www/html
        networks:
            default:
                # Chromium refuses plain HTTP to the host "app", because "app"
                # is a top-level domain on its HSTS preload list; the browser
                # tests use this alias.
                aliases:
                    - bantukasir-app
        depends_on:
            db:
                condition: service_healthy
            db-setup:
                condition: service_completed_successfully
        healthcheck:
            # Healthy when Nginx, PHP-FPM and Laravel answer: a JSON request
            # for a path that no route serves gets Laravel's NOT_FOUND
            # (TASK-007), which needs neither the database's tables nor the
            # frontend build, both of which come after the start (the
            # migration and the build steps of CI). RH-01, /up, needs the
            # migrated database for its rate bucket, so it is not this check.
            test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' -H 'Accept: application/json' http://127.0.0.1:8080/local-start-check | grep -qx '404'"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 600s

    db:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        environment:
            POSTGRES_DB: bantukasir
            POSTGRES_HOST_AUTH_METHOD: trust
        volumes:
            - db-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres", "-d", "bantukasir"]
            interval: 2s
            timeout: 5s
            retries: 30

    db-setup:
        # The setup of the local databases (TASK-004), with psql of the same
        # pinned image; it runs once per start and exits.
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        entrypoint: ["sh", "/setup/local.sh"]
        environment:
            PGHOST: db
            PGUSER: postgres
        volumes:
            - ./database/setup:/setup:ro
        depends_on:
            db:
                condition: service_healthy
        restart: "no"

    backup-store:
        # The S3-compatible test server of the backup's tests (TASK-013 scope item
        # 7), on the internal network only, with no port on the host. MinIO
        # (AGPL-3.0), built by docker/backup-store/Dockerfile, with its default test
        # credentials, which only this service accepts and which guard nothing: it
        # holds what the tests write, encrypted to a key the harness made, in an
        # anonymous volume. MINIO_CI_CD leaves out the checks of a production drive.
        # The real store is the operator's, at gate G4 (TASK-045).
        build:
            context: docker/backup-store
        image: bantukasir-backup-store:local
        environment:
            MINIO_CI_CD: "1"
            MINIO_BROWSER: "off"
        volumes:
            - /data
        healthcheck:
            test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
            interval: 2s
            timeout: 5s
            retries: 30

    node:
        image: node:24.22.0-trixie-slim@sha256:7f486cabe892bff8fef04c0f7da8dba84a560be3e4e2740b7a86afc57ebec315
        profiles: ["tools"]
        working_dir: /app
        volumes:
            - .:/app

    playwright:
        image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
        profiles: ["tools"]
        working_dir: /app
        environment:
            E2E_BASE_URL: http://bantukasir-app:8080
        volumes:
            - .:/app

volumes:
    db-data:
