# Nginx of the image, in the release and in the local environment alike
# (TASK-012; SECURITY_MODEL THR-15, SEC-HDR-02, SEC-UP-02; TECHNICAL_RULES section
# 9; ROUTE_CONTRACTS RT-12). It starts as the image's user, so nothing here needs
# root: the listeners are above 1024, and the process and temporary files are in
# /tmp.
#
# Only public/ is served. public/index.php runs only through the front
# controller's locations, never by its address; no other PHP file runs; every
# dotfile, vendor/, storage/ and every path outside public/ is unreachable.
#
# The application's answers carry their own headers (App\Http\Middleware\
# SecurityHeaders), so the front controller's locations add none; every answer
# that Nginx makes itself adds the headers of SEC-HDR-02 and the baseline policy
# of SEC-HDR-03 without a nonce, its own refusals and its 502 and 504 included
# (TASK-007 finding F-11). A refusal of its own has one empty line for a body: an
# empty text in `return` would mean its built-in page, which names the server. Only
# the answer to a request line it cannot parse (400) runs no location, so it has
# neither.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    scgi_temp_path /tmp/nginx-scgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;

    # At least the application's 60 seconds, so that the application, not the
    # web server, decides the outcome (TECHNICAL_RULES section 9).
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # The body limits of RT-12 (SEC-UP-02), three layers, the outer just above
    # the inner, so that the application gives the clear refusal:
    #
    #                        Application    PHP post_max_size   Nginx
    #   JSON and form bodies 1 MiB          1100K               1200k
    #   RC-32                5 MiB          7M                  8m
    #
    # A route with a larger limit has an exact location below: TASK-018 adds
    # RC-25 (8 MiB) and the Task of RR-01 (2 MiB).
    client_max_body_size 1200k;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        charset utf-8;

        error_page 404 @not_found;
        error_page 413 @too_large;
        error_page 502 @bad_gateway;
        error_page 504 @gateway_timeout;

        location / {
            include /etc/nginx/bantukasir-security-headers.conf;
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            internal;
            include /etc/nginx/bantukasir-front-controller.conf;
            fastcgi_param PHP_VALUE "post_max_size=1100K\nupload_max_filesize=1M";
        }

        # RC-32, with its logo (TASK-010 finding F-3).
        location = /commands/business_profile.change {
            client_max_body_size 8m;
            include /etc/nginx/bantukasir-front-controller.conf;
            fastcgi_param PHP_VALUE "post_max_size=7M\nupload_max_filesize=6M";
        }

        location ~ /\. {
            include /etc/nginx/bantukasir-security-headers.conf;
            default_type text/plain;
            return 403 "\n";
        }

        location ~ ^/(vendor|storage|bootstrap|node_modules|tests)(/|$) {
            include /etc/nginx/bantukasir-security-headers.conf;
            default_type text/plain;
            return 404 "\n";
        }

        location ~ \.php$ {
            include /etc/nginx/bantukasir-security-headers.conf;
            default_type text/plain;
            return 404 "\n";
        }

        location @not_found {
            include /etc/nginx/bantukasir-security-headers.conf;
            default_type text/plain;
            return 404 "\n";
        }

        location @too_large {
            include /etc/nginx/bantukasir-security-headers.conf;
            default_type text/plain;
            return 413 "\n";
        }

        location @bad_gateway {
            include /etc/nginx/bantukasir-security-headers.conf;
            default_type text/plain;
            return 502 "\n";
        }

        location @gateway_timeout {
            include /etc/nginx/bantukasir-security-headers.conf;
            default_type text/plain;
            return 504 "\n";
        }
    }

    # The listener of the container's own health check, on the loopback address
    # only, for RH-01 only (TASK-007 finding F-1): the application's address is
    # HTTPS, a plain request from the loopback address is no trusted hop, and the
    # health check knows that it is the container itself. It still sends the
    # environment's host name, which the application checks.
    server {
        listen 127.0.0.1:8081;
        server_name _;
        root /var/www/html/public;
        access_log off;

        location = /up {
            include /etc/nginx/bantukasir-front-controller.conf;
            fastcgi_param HTTPS on;
            fastcgi_param PHP_VALUE "post_max_size=1100K\nupload_max_filesize=1M";
        }

        location / {
            default_type text/plain;
            return 404 "\n";
        }
    }
}
