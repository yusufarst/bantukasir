; PHP's settings of the image, over php.ini-production or, in the local
; environment, php.ini-development (TASK-012).
;
; The upload limits here are the largest of the application, RC-32's logo of
; 5 MiB (ROUTE_CONTRACTS RT-12; SECURITY_MODEL SEC-UP-02); Nginx sets the limits
; of each route for PHP-FPM with PHP_VALUE (nginx.conf). The command line has no
; route: these are its limits. TASK-018 raises them for photos.
;
; memory_limit stays PHP's default and changeable, because ImageNormalizer raises
; it for one request, bounded by the image's dimensions (TASK-010 finding F-5).
; max_execution_time counts CPU time and does not apply to the command line;
; PHP-FPM's request_terminate_timeout bounds the wall-clock time (php-fpm.conf).
expose_php = Off
max_execution_time = 60
max_input_time = 60
post_max_size = 7M
upload_max_filesize = 6M
