# The headers of SECURITY_MODEL SEC-HDR-02 and the baseline policy of SEC-HDR-03
# without a nonce, which no static file needs, for every answer that Nginx makes
# itself (TASK-007, TASK-012). A location that adds a header inherits none, so
# each one includes this file.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
