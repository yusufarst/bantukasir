# The FastCGI parameters of the front controller (TASK-012), for each location
# that runs it. Only public/index.php ever runs. PHP-FPM listens on the loopback
# address only, because these parameters can set PHP's configuration
# (PHP_VALUE, which each location sets for its body limit).
fastcgi_pass 127.0.0.1:9000;
fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param QUERY_STRING $query_string;
fastcgi_param REQUEST_METHOD $request_method;
fastcgi_param CONTENT_TYPE $content_type;
fastcgi_param CONTENT_LENGTH $content_length;
fastcgi_param REQUEST_URI $request_uri;
fastcgi_param DOCUMENT_URI $document_uri;
fastcgi_param DOCUMENT_ROOT $document_root;
fastcgi_param SERVER_PROTOCOL $server_protocol;
fastcgi_param REQUEST_SCHEME $scheme;
fastcgi_param HTTPS $https if_not_empty;
fastcgi_param GATEWAY_INTERFACE CGI/1.1;
fastcgi_param SERVER_SOFTWARE nginx;
fastcgi_param REMOTE_ADDR $remote_addr;
fastcgi_param REMOTE_PORT $remote_port;
fastcgi_param SERVER_ADDR $server_addr;
fastcgi_param SERVER_PORT $server_port;
fastcgi_param SERVER_NAME $server_name;
fastcgi_param REDIRECT_STATUS 200;
# A request's Proxy header never becomes the HTTP_PROXY of the application.
fastcgi_param HTTP_PROXY "";
# The received time of TECHNICAL_RULES TR-TIME-03 (TASK-008): the moment nginx
# hands the complete, buffered request to PHP-FPM, stamped by nginx and never
# taken from a request header (App\Http\Commands\ReceivedAt).
fastcgi_param REQUEST_RECEIVED_AT $msec;
fastcgi_hide_header X-Powered-By;
# Above PHP-FPM's request_terminate_timeout of 60 seconds, which decides.
fastcgi_read_timeout 70s;
fastcgi_send_timeout 70s;
