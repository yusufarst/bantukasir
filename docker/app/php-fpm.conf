; PHP-FPM's pool of the image (TASK-012), after the official image's own files.
; It keeps their clear_env = no, because the application's settings come from the
; environment.
[www]
; The loopback address only: the official image's listen = 9000 takes every
; address, and whoever reaches this port can set PHP's configuration.
listen = 127.0.0.1:9000

; The application's limit per request, in wall-clock time (TECHNICAL_RULES
; section 9): the worker is killed and Nginx answers 502. PHP-FPM's master looks
; at its workers a third of the smallest such limit apart: 20 seconds with this one
; alone, which ended a request after 78 seconds in the image checks, past the
; client's wait of 65 seconds. The pool at the end of this file makes it a second.
request_terminate_timeout = 60s

; The worker pool of TR-TIME-03. An assumption that TASK-048 measures (PERF01):
; one shop has at most about four people at work at once, two cashiers among them
; (ADR-002), an ordinary command takes far below a second, and only an Owner's
; bounded heavy command takes up to 30 seconds, at most two at a time. Those two
; leave six workers for everything else, so that the wait before a command starts
; stays far below 30 seconds. At about 60 MiB each, eight workers fit beside
; PostgreSQL on the 4 GB server of ENVIRONMENTS section 5.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Nginx writes the one access line of each request.
access.log = /dev/null

; A pool that serves nothing: nothing connects to its socket, and it starts no
; worker. Its short limit only sets how often the master looks at the workers of
; every pool, so that a request of the pool above ends within a second of its limit.
; Its user is what a master running as root requires, as in the local environment;
; the release's master runs as www-data and ignores it.
[limit-check]
user = www-data
group = www-data
listen = /tmp/php-fpm-limit-check.sock
pm = ondemand
pm.max_children = 1
request_terminate_timeout = 3s
access.log = /dev/null
