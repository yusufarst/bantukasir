# The ci workflow (ADR-011 item 4, TEST_STRATEGY section 7, TASK-001): the command
# contract on every pull request and every push to develop and main, in the
# containers of the local environment, so that CI runs the same images as the
# Owner's machine: the application container, PostgreSQL of the pinned version
# by digest as the db service container, Node.js and Playwright. It holds no
# secret of any environment and publishes nothing; the only credential is the
# token GitHub issues to the workflow, read-only and not kept in the checkout.
# No scheduled trigger is used. The L5 step runs every browser test, the
# sign-in path of TASK-006 among them (EXECUTION_CONTEXT EXC-34), on the local
# database, which the migrations bring to the schema first, as the migration
# role, as on the Owner's machine (compose.yaml). A push of a task/ branch runs the
# fast-checks workflow instead (EXECUTION_CONTEXT CE-46, D-117), so that this whole
# run is the pull request's and develop's; a newer push of a pull request cancels
# the run of its older head, and a run on develop or main is never cancelled.
#
# `composer test:postgres` runs as its two parts, the jobs PostgreSQL (1/2) and
# PostgreSQL (2/2), each on its own runner with its own local environment and
# test database, beside Command contract, which runs every other command of the
# contract (D-120). No job of this workflow has a condition. Command contract's
# last step waits for both parts and passes only when each finished with success
# in this run (scripts/checks/required-jobs.sh): the tick reads a head as green
# only when Command contract passed (scripts/executor/lib.sh), and a part that is
# skipped or missing would fail no check run of its own. That step reads the
# run's jobs with the workflow's token, which is why Command contract alone may
# read actions. composer lint proves that the parts hold every test of the suite
# once (scripts/checks/postgres-parts.sh).
name: ci

on:
    pull_request:
    push:
        branches:
            - develop
            - main

concurrency:
    group: ci-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    command-contract:
        name: Command contract
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
            actions: read
        steps:
            - name: Check out the repository with its history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Select the commits for the secret scan
              id: commits
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
                  PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
                  PUSH_BEFORE: ${{ github.event.before }}
                  PUSH_AFTER: ${{ github.sha }}
                  PUSH_REF: ${{ github.ref }}
              run: |
                  if [ "$EVENT_NAME" = pull_request ]; then
                      log_opts="$PULL_REQUEST_BASE..$PULL_REQUEST_HEAD"
                  elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
                      log_opts="$PUSH_BEFORE..$PUSH_AFTER"
                  else
                      # A new branch: the commits that no other branch on GitHub holds.
                      others="$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v -x "refs/remotes/origin/${PUSH_REF#refs/heads/}" | grep -v -x 'refs/remotes/origin/HEAD' | tr '\n' ' ')"
                      log_opts="$PUSH_AFTER --not $others"
                  fi
                  echo "log_opts=$log_opts" >> "$GITHUB_OUTPUT"

            - name: Start the local environment (one command)
              run: docker compose up -d --build --wait

            - name: composer validate
              run: docker compose exec -T app composer validate --strict --no-check-all

            - name: composer lint
              env:
                  SECRET_SCAN_LOG_OPTS: ${{ steps.commits.outputs.log_opts }}
              run: docker compose exec -T -e SECRET_SCAN_LOG_OPTS app composer lint

            - name: composer analyse
              run: docker compose exec -T app composer analyse

            - name: composer test:unit
              run: docker compose exec -T app composer test:unit

            - name: composer test:race
              run: docker compose exec -T app composer test:race

            - name: Install the npm dependencies from the lockfile
              run: docker compose run --rm node npm ci

            - name: npm run lint
              run: docker compose run --rm node npm run lint

            - name: npm run typecheck
              run: docker compose run --rm node npm run typecheck

            - name: npm run test:unit
              run: docker compose run --rm node npm run test:unit

            - name: npm run build
              run: docker compose run --rm node npm run build

            - name: Migrate the local database of the browser tests
              run: docker compose exec -T app php artisan migrate --database=pgsql_migration --force

            - name: npm run test:e2e
              run: docker compose run --rm playwright npm run test:e2e

            - name: Stop the local environment
              if: always()
              run: docker compose down

            - name: Both parts of composer test:postgres passed in this run
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bash scripts/checks/required-jobs.sh "PostgreSQL (1/2)" "PostgreSQL (2/2)"

    # The first part of composer test:postgres (D-120): tests/Feature without the
    # directories of the second part, on its own runner and test database.
    postgres-1:
        name: PostgreSQL (1/2)
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - name: Check out the repository with its history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Start the local environment (one command)
              run: docker compose up -d --build --wait

            - name: composer test:postgres:1
              run: docker compose exec -T app composer test:postgres:1

            - name: Stop the local environment
              if: always()
              run: docker compose down

    # The second part of composer test:postgres (D-120): the directories that
    # the suite Postgres2 of phpunit.xml names, on its own runner and test database.
    postgres-2:
        name: PostgreSQL (2/2)
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - name: Check out the repository with its history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Start the local environment (one command)
              run: docker compose up -d --build --wait

            - name: composer test:postgres:2
              run: docker compose exec -T app composer test:postgres:2

            - name: Stop the local environment
              if: always()
              run: docker compose down

    # The image checks of RELEASE_PROCESS section 4 items 1 to 4 (TASK-012), on the
    # release stage of the image's definition, which this job builds and never
    # publishes; TASK-014's release workflow publishes it. The tick and a merge
    # need every check run of a head to pass (scripts/executor/lib.sh).
    image-checks:
        name: Image checks
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build the release image and check it
              run: bash scripts/checks/image-checks.sh
