<!doctype html>
<html lang="id" data-accent="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview</title>
<link rel="stylesheet" href="assets/bk-tokens.css">
<link rel="stylesheet" href="assets/bk-base.css">
<link rel="stylesheet" href="assets/bk-components.css">
</head>
<!-- KS-02 · UXP-007 Beranda (Owner home). Panels in contract order: today, open
     sessions, attention (NAVIGATION_CONTRACTS UXP-007). States: ?state=default | quiet | failed | loading -->
<body data-page="UXP-007" data-title-key="reporting.home.title" data-layout="side" data-nav="home" data-role="owner" data-roles="owner">
<div class="bk-app" id="bk-app">
  <div class="bk-col">
    <main id="main" class="bk-main" tabindex="-1">
      <div class="bk-container">
        <div class="bk-pagehead">
          <div class="bk-pagehead__text">
            <h1 class="bk-title bk-title--shell" tabindex="-1" data-k="reporting.home.title" data-first-focus></h1>
            <p class="bk-meta" data-k="reporting.as_of" data-p='{"waktu":"17 Oktober 2026, 13.45.00"}'></p>
          </div>
        </div>
        <div class="bk-stack">
          <section class="bk-card" aria-labelledby="today-title">
            <div class="bk-section bk-section--bar">
              <div class="bk-section__head bk-section__head--flush">
                <h2 class="bk-h2" id="today-title" data-k="reporting.home.today"></h2>
                <a class="bk-btn bk-btn--quiet" href="index.html#outside-set"><span data-k="reporting.daily.title"></span><span data-icon="chevron-right"></span></a>
              </div>
            </div>
            <div class="bk-metrics" data-unless="failed loading">
              <div class="bk-metric">
                <p class="bk-metric__label" data-k="reporting.figure.net_sales"></p>
                <p class="bk-metric__value" data-fixture>Rp4.385.500</p>
                <p class="bk-metric__hint" data-k="reporting.figure.net_sales_help"></p>
              </div>
              <div class="bk-metric">
                <p class="bk-metric__label" data-k="reporting.figure.sale_count"></p>
                <p class="bk-metric__value" data-fixture>47</p>
              </div>
              <div class="bk-metric">
                <p class="bk-metric__label" data-k="reporting.figure.payments_cash"></p>
                <p class="bk-metric__value" data-fixture>Rp2.910.500</p>
              </div>
              <div class="bk-metric">
                <p class="bk-metric__label" data-k="reporting.figure.payments_transfer"></p>
                <p class="bk-metric__value" data-fixture>Rp1.475.000</p>
              </div>
            </div>
            <div class="bk-section" data-when="failed">
              <div class="bk-notice bk-notice--danger" role="alert">
                <span data-icon="danger"></span>
                <p class="bk-notice__title" data-k="ux.state.load_failed.title"></p>
                <p class="bk-notice__body" data-k="ux.state.load_failed.body"></p>
                <div class="bk-notice__actions"><button type="button" class="bk-btn bk-btn--secondary" id="retry-today" data-k="ux.action.retry"></button></div>
              </div>
            </div>
            <div class="bk-section bk-skel-group" data-when="loading" role="status" aria-busy="true">
              <span class="bk-sr-only" data-k="ux.state.loading.body"></span>
              <div class="bk-skel bk-skel--w40"></div><div class="bk-skel bk-skel--w60"></div><div class="bk-skel bk-skel--w30"></div>
            </div>
          </section>

          <div class="bk-grid-2">
            <section class="bk-card bk-section" aria-labelledby="sessions-title">
              <div class="bk-section__head"><h2 class="bk-h2" id="sessions-title" data-k="reporting.home.open_sessions"></h2></div>
              <div class="bk-rows" data-unless="quiet">
                <a class="bk-row" href="index.html#outside-set">
                  <span class="bk-row__icon" data-icon="drawer"></span>
                  <span class="bk-row__main"><span class="bk-row__title" data-k="reporting.home.open_session_row" data-p='{"laci":"Laci 1","nama":"Rina","waktu":"17 Oktober 2026, 07.58.12"}'></span></span>
                  <span class="bk-row__end" data-icon="chevron-right"></span>
                </a>
                <a class="bk-row" href="index.html#outside-set">
                  <span class="bk-row__icon" data-icon="drawer"></span>
                  <span class="bk-row__main"><span class="bk-row__title" data-k="reporting.home.open_session_row" data-p='{"laci":"Laci 2","nama":"Dewi","waktu":"17 Oktober 2026, 12.02.40"}'></span></span>
                  <span class="bk-row__end" data-icon="chevron-right"></span>
                </a>
              </div>
              <p class="bk-empty" data-when="quiet" data-k="reporting.home.open_sessions_empty"></p>
            </section>

            <section class="bk-card bk-section" aria-labelledby="attention-title">
              <div class="bk-section__head"><h2 class="bk-h2" id="attention-title" data-k="reporting.home.attention"></h2></div>
              <div class="bk-rows" data-unless="quiet">
                <a class="bk-row bk-row--warning" href="ks-08-stok.html?peran=owner&amp;state=attention">
                  <span class="bk-row__icon" data-icon="boxes"></span>
                  <span class="bk-row__main"><span class="bk-row__title" data-k="reporting.home.attention_restock" data-p='{"jumlah":"7"}'></span></span>
                  <span class="bk-row__end" data-icon="chevron-right"></span>
                </a>
                <a class="bk-row bk-row--pending" href="index.html#outside-set">
                  <span class="bk-row__icon" data-icon="tag"></span>
                  <span class="bk-row__main"><span class="bk-row__title" data-k="reporting.home.attention_cost" data-p='{"jumlah":"3"}'></span></span>
                  <span class="bk-row__end" data-icon="chevron-right"></span>
                </a>
                <a class="bk-row bk-row--danger" href="index.html#outside-set">
                  <span class="bk-row__icon" data-icon="danger"></span>
                  <span class="bk-row__main"><span class="bk-row__title" data-k="reporting.home.attention_incidents" data-p='{"jumlah":"1"}'></span></span>
                  <span class="bk-row__end" data-icon="chevron-right"></span>
                </a>
                <a class="bk-row bk-row--warning" href="index.html#outside-set">
                  <span class="bk-row__icon" data-icon="warning"></span>
                  <span class="bk-row__main"><span class="bk-row__title" data-k="reporting.home.attention_status"></span></span>
                  <span class="bk-row__end" data-icon="chevron-right"></span>
                </a>
              </div>
              <p class="bk-empty" data-when="quiet" data-k="reporting.home.attention_empty"></p>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="bk-live" id="bk-live-polite" aria-live="polite"></div>
<div class="bk-live" id="bk-live-assertive" aria-live="assertive"></div>
<script src="assets/bk-copy.js"></script>
<script src="assets/bk-icons.js"></script>
<script src="assets/bk-app.js"></script>
</body>
</html>
